name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-shared:
    name: Test Shared
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/shared/package-lock.json

      - name: Install shared dependencies
        working-directory: app/shared
        run: npm ci

      - name: Check formatting
        working-directory: app/shared
        run: npm run format:check

      - name: Lint
        working-directory: app/shared
        run: npm run lint

      - name: Typecheck
        working-directory: app/shared
        run: npm run typecheck

      - name: Build shared
        working-directory: app/shared
        run: npm run build

  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    needs: test-shared

    env:
      JWT_SECRET: some-long-random-access-secret
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: summit_test_uid
      POSTGRES_PASSWORD: summit_test_pwd
      POSTGRES_DB: summit_ci
      SERVER_BIND_ADDRESS: 0.0.0.0
      SERVER_PORT: 3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/shared/package-lock.json
            app/server/package-lock.json

      - name: Install shared dependencies
        working-directory: app/shared
        run: npm ci

      - name: Build shared
        working-directory: app/shared
        run: npm run build

      - name: Install server dependencies
        working-directory: app/server
        run: npm ci

      - name: Generate prisma
        working-directory: app/server
        run: npm run prisma:generate:git

      - name: Check formatting
        working-directory: app/server
        run: npm run format:check

      - name: Lint
        working-directory: app/server
        run: npm run lint

      - name: Typecheck
        working-directory: app/server
        run: npm run typecheck

      - name: Build server
        working-directory: app/server
        run: npm run build

      - name: Run unit tests
        working-directory: app/server
        run: npm run test:unit

  test-integration:
    name: Test Integration
    runs-on: ubuntu-latest
    needs: test-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create CI environment file
        run: |
          cat > .env <<EOF
          JWT_SECRET=some-long-random-access-secret
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          POSTGRES_USER=summit_ci
          POSTGRES_PASSWORD=summit_ci
          POSTGRES_DB=summit_ci
          SERVER_BIND_ADDRESS=0.0.0.0
          SERVER_PORT=3000
          EOF

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build and start containers
        run: docker compose up --build -d

      - name: Show container status
        run: docker compose ps

      - name: Test API ping endpoint
        run: |
          curl \
            --fail \
            --retry 15 \
            --retry-delay 2 \
            --retry-all-errors \
            --max-time 5 \
            http://localhost:3000/api/ping/database

      - name: Run integration tests
        run: docker compose exec -T server npm run test:integration

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v
